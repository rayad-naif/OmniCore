# Render Blueprint — whole OmniCore stack in one web service + Postgres.
# Dashboard → New → Blueprint → pick this repo. Fill the "sync: false" values
# when prompted (or later under the service's Environment tab).
#
# Free plan notes (testing only): the web service sleeps after ~15 min idle
# (first request takes ~1 min; background jobs pause while asleep), the free
# database expires after 30 days, and the disk is ephemeral — set the R2_*
# variables so uploads survive restarts.
services:
  - type: web
    name: omnicore
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: node artifacts/api-server/scripts/migrate.mjs && node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: omnicore-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: INTEGRATIONS_ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: BILLING_PROVIDER
        value: paddle
      - key: PADDLE_ENVIRONMENT
        value: sandbox
      # PUBLIC_APP_URL defaults to Render's onrender.com URL. Set it when you
      # add a custom domain (e.g. https://omnicore.irofficial.com).
      - key: PUBLIC_APP_URL
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD # first boot only; min 12 chars; remove after signing in
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # HR module database (optional). A free MongoDB Atlas cluster works for
      # testing: mongodb+srv://user:pass@cluster0.xxxx.mongodb.net
      - key: HRMS_MONGODB_URI
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: VITE_PADDLE_CLIENT_TOKEN # build-time; redeploy after changing
        sync: false
      - key: R2_ENDPOINT # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: GHL_CLIENT_ID
        sync: false
      - key: GHL_CLIENT_SECRET
        sync: false
      - key: GHL_WEBHOOK_ED25519_PUBLIC_KEY
        sync: false

databases:
  - name: omnicore-db
    plan: free
    databaseName: omnicore
    user: omnicore
