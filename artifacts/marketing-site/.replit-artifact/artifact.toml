kind = "web"
previewPath = "/"
title = "Atelier OmniCore — Marketing Site"
version = "1.0.0"
id = "artifacts/marketing-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21209

[services.development]
run = "pnpm --filter @workspace/marketing-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marketing-site", "run", "build" ]
publicDir = "artifacts/marketing-site/dist/public"
serve = "static"

# Clean URLs -> prerendered static HTML files (crawlers get route-correct HTML).
# Trailing-slash variants map to the same file so /pricing/ does not fall through
# to the home shell and inherit the wrong metadata.
[[services.production.rewrites]]
from = "/pricing"
to = "/pricing.html"

[[services.production.rewrites]]
from = "/pricing/"
to = "/pricing.html"

[[services.production.rewrites]]
from = "/contact"
to = "/contact.html"

[[services.production.rewrites]]
from = "/contact/"
to = "/contact.html"

[[services.production.rewrites]]
from = "/help"
to = "/help.html"

[[services.production.rewrites]]
from = "/help/"
to = "/help.html"

[[services.production.rewrites]]
from = "/terms"
to = "/terms.html"

[[services.production.rewrites]]
from = "/terms/"
to = "/terms.html"

[[services.production.rewrites]]
from = "/privacy"
to = "/privacy.html"

[[services.production.rewrites]]
from = "/privacy/"
to = "/privacy.html"

[[services.production.rewrites]]
from = "/refunds"
to = "/refunds.html"

[[services.production.rewrites]]
from = "/refunds/"
to = "/refunds.html"

# SPA fallback for client-only routes that are NOT prerendered (e.g. /checkout).
# These are served through the app shell so deep links / hard refreshes work.
# NOTE: there is intentionally no blanket "/*" catch-all. Unknown paths are left
# unmatched so the static host returns a real HTTP 404 (serving 404.html) rather
# than a 200 home shell, which would look like an indexable soft 404 to crawlers.
[[services.production.rewrites]]
from = "/checkout"
to = "/index.html"

[[services.production.rewrites]]
from = "/checkout/"
to = "/index.html"

[[services.production.rewrites]]
from = "/checkout/success"
to = "/index.html"

[[services.production.rewrites]]
from = "/checkout/success/"
to = "/index.html"

[services.env]
PORT = "21209"
BASE_PATH = "/"
