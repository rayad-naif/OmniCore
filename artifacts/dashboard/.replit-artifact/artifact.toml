kind = "web"
previewPath = "/dashboard/"
title = "Atelier OmniCore Dashboard"
version = "1.0.0"
id = "dash_OmniCore_2026_v001"

[[services]]
localPort = 5174
name = "Dashboard"
paths = ["/dashboard"]

[services.development]
run = "pnpm --filter @workspace/dashboard run dev"

[services.production]
serve = "static"
publicDir = "artifacts/dashboard/dist/public"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/dashboard", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.production.health.startup]
path = "/dashboard/"
